<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure API Management - 템플릿</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        h1 {
            color: white;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
        }
        .info {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }
        code {
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 3px;
        }
        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 20px;
            margin: 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>🚀 Azure API Management 템플릿</h1>
    <div class="info">
        <h2>환영합니다!</h2>
        <p>이것은 <strong>Azure API Management</strong> 프로젝트 템플릿입니다.</p>
        <p>시작하려면 <code>npm install</code>을 실행하세요.</p>
        <div>
            <span class="badge">✨ Modern</span>
            <span class="badge">⚡ Fast</span>
            <span class="badge">🎨 Beautiful</span>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
